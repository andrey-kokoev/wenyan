name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - name: Configure npm auth
        run: |
          echo "@wenyan:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Verify package tarballs
        run: pnpm release:pack:check

      - name: Publish selected packages
        run: |
          pnpm -r \
            --filter @wenyan/core \
            --filter @wenyan/actor \
            --filter @wenyan/seal \
            --filter @wenyan/archive \
            --filter @wenyan/pipeline \
            --filter @wenyan/gateway \
            --filter @wenyan/channel \
            --filter @wenyan/gossip \
            --filter @wenyan/crdt \
            --filter @wenyan/consensus \
            --filter @wenyan/bridge \
            --filter @wenyan/genesis \
            --filter @wenyan/cli \
            publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
