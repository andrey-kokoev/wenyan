[archive]
engine = "sqlite"
path = "./wenyan.dang'an"

[genesis]
node_id = "11111111-1111-4111-8111-111111111111"
genesis_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[gateway]
upstream = "http://127.0.0.1:8787"

[gateway.listen]
host = "127.0.0.1"
port = 8787

[law]
mode = "strict"

[law_cache]
ttl_seconds = 60
preload_types = ["appointment", "classification"]

[distributed]
mode = "single"
node_id = "node-a"
bind_gossip = "127.0.0.1:7946"
seeds = []
fanout = 3
suspicion_timeout_ms = 5000

[consensus]
kind = "none"
replica_set = []
constitutional_threshold = 3
view_change_timeout_ms = 5000

[sync]
batch_size = 200
max_inflight = 4
retry_backoff_ms = 300

[bridge]
enabled = false
mode = "standalone"

[bridge.sync]
mode = "hybrid"
poll_interval_ms = 1000
batch_size = 100

[bridge.circuit_breaker]
failure_rate_threshold = 0.05
cool_down_ms = 30000
max_retries = 10

[[bridge.adapters]]
id = "nats-main"
protocol = "nats"
url = "nats://127.0.0.1:4222"
subject_pattern = ["events.*"]
target_genre = "telemetry"
idempotency_header = "Nats-Msg-Id"
trust_provenance = false
