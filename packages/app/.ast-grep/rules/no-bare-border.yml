id: no-bare-border
language: html
severity: error
message: "Avoid bare `border` class. Use `border border-border` or another semantic border color."
rule:
  kind: attribute
  all:
    - has:
        kind: attribute_name
        pattern: class
    - has:
        kind: attribute_value
        regex: "(^|\\s)border(\\s|$)"
  not:
    has:
      kind: attribute_value
      regex: "(^|\\s)border-[^\\s]+"
