groups:
  - name: wenyan
    rules:
      - alert: WenyanMerkleDrift
        expr: wenyan_merkle_root_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Wenyan merkle root update lag detected
      - alert: WenyanHighLatency
        expr: histogram_quantile(0.99, sum(rate(wenyan_seal_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Wenyan p99 seal latency high
      - alert: WenyanByzantineQuorum
        expr: wenyan_byzantine_suspicions > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Wenyan suspected byzantine member count non-zero
